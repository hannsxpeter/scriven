<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="t d">
  <title id="t">Scriven is now Scriveno</title>
  <desc id="d">Warp zone screen. The old Scriven name is struck through above the Scriveno wordmark, with the line: same writing studio, new name and new home. A new location panel lists the retired repository hannsxpeter/scriven, the active repository hannsxpeter/scriveno, the package @hxp-tools/scriveno, and the first command /scr-first-run. A seven segment level bar is fully lit and reads stage clear, warp to Scriveno.</desc>
  <style>
    .sans{font-family:"Avenir Next","Helvetica Neue",Helvetica,Arial,sans-serif}
    .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
  </style>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="10" fill="#1B1916" stroke="#34312B"/>
  <path d="M1 44H1199V11a10 10 0 0 0-10-10H11A10 10 0 0 0 1 11Z" fill="#23211D"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#34312B"/>
  <text x="32" y="28" class="mono" font-size="13" font-weight="700" fill="#F2F65A" letter-spacing="1.5">WARP ZONE</text>
  <text x="600" y="28" class="mono" font-size="13" fill="#A5A397" text-anchor="middle">hannsxpeter/scriven  &gt;  hannsxpeter/scriveno</text>
  <text x="1168" y="28" class="mono" font-size="13" fill="#A5A397" text-anchor="end">PRESS START  /scr-first-run</text>

  <text x="56" y="106" class="sans" font-size="40" font-weight="700" fill="#6E6B62" textLength="148" lengthAdjust="spacingAndGlyphs">Scriven</text>
  <rect x="50" y="92" width="160" height="4" fill="#F2F65A"/>
  <text x="226" y="104" class="mono" font-size="13" font-weight="700" fill="#A5A397" letter-spacing="2">LEGACY BUILD, RETIRED</text>

  <text x="52" y="218" class="sans" font-size="128" font-weight="800" fill="#EDEDE6" letter-spacing="-4">Scriveno</text>
  <rect x="52" y="238" width="56" height="6" fill="#F2F65A"/>
  <text x="52" y="288" class="sans" font-size="30" font-weight="600" fill="#EDEDE6">Same writing studio.</text>
  <text x="52" y="326" class="sans" font-size="30" font-weight="600" fill="#EDEDE6">New name, new home.</text>

  <g transform="translate(776 76)">
    <rect width="392" height="270" rx="4" fill="#23211D" stroke="#34312B"/>
    <text x="20" y="31" class="mono" font-size="12" font-weight="700" fill="#A5A397" letter-spacing="2">NEW LOCATION</text>
    <line x1="0" y1="46" x2="392" y2="46" stroke="#34312B"/>
    <g class="sans" font-size="17" fill="#EDEDE6">
      <text x="20" y="80">Old repo</text>
      <text x="20" y="124">New repo</text>
      <text x="20" y="168">Package</text>
      <text x="20" y="212">Status</text>
      <text x="20" y="256">First move</text>
    </g>
    <g class="mono" font-size="15" font-weight="700" text-anchor="end">
      <text x="372" y="80" fill="#6E6B62">hannsxpeter/scriven</text>
      <text x="372" y="124" fill="#F2F65A">hannsxpeter/scriveno</text>
      <text x="372" y="168" fill="#F2F65A">@hxp-tools/scriveno</text>
      <text x="372" y="212" fill="#F2F65A">ACTIVE</text>
      <text x="372" y="256" fill="#F2F65A">/scr-first-run</text>
    </g>
    <g stroke="#34312B">
      <line x1="0" y1="90" x2="392" y2="90"/><line x1="0" y1="134" x2="392" y2="134"/>
      <line x1="0" y1="178" x2="392" y2="178"/><line x1="0" y1="222" x2="392" y2="222"/>
    </g>
  </g>

  <g transform="translate(52 372)">
    <rect width="86" height="14" fill="#F2F65A"/>
    <rect x="94" width="86" height="14" fill="#F2F65A"/>
    <rect x="188" width="86" height="14" fill="#F2F65A"/>
    <rect x="282" width="86" height="14" fill="#F2F65A"/>
    <rect x="376" width="86" height="14" fill="#F2F65A"/>
    <rect x="470" width="86" height="14" fill="#F2F65A"/>
    <rect x="564" width="86" height="14" fill="#F2F65A"/>
    <text x="672" y="13" class="mono" font-size="13" fill="#A5A397">STAGE CLEAR  WARP TO SCRIVENO</text>
  </g>
</svg>
